name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummykey
          NEXT_PUBLIC_API_URL: https://dummy-api.example.com
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    env:
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummykey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest tests evals/suite_e_policy.py -q
      - name: Deterministic eval suites
        run: |
          python -m evals.runner --suite a_ranking
          python -m evals.runner --suite e_policy

  smoke-evals:
    # LLM-backed suites: only when prompts/services/evals change, and only
    # when the API keys are available (forks and Dependabot get skipped).
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: agents
    env:
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummykey
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for agent-affecting changes
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -qE '^agents/(prompts|services|evals)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true' && env.OPENAI_API_KEY != ''
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true' && env.OPENAI_API_KEY != ''
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Reply classification smoke eval
        if: steps.changes.outputs.run == 'true' && env.OPENAI_API_KEY != ''
        run: python -m evals.runner --suite d_reply --smoke
